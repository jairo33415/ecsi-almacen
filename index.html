async function cleanNoDate(){
 const bad=S.moves.filter(m=>!m.d);if(!bad.length)return toast('No hay registros sin fecha');
 const adj={};bad.forEach(m=>{const q=Number(m.q);if(isNaN(q))return;if(m.t==='ENTRADA')adj[m.p]=(adj[m.p]||0)+q;else if(m.t==='SALIDA')adj[m.p]=(adj[m.p]||0)-q});
 const old=calc(),oldP=S.products,oldM=S.moves;
 const nP=oldP.map(p=>{const o=old.find(x=>x.n===p.n);return adj[p.n]?{...p,b:Math.round((p.b+adj[p.n])*100)/100,m:(p.m!=null&&p.m!=='')?p.m:o.min}:p});
 S.products=nP;S.moves=oldM.filter(m=>m.d);const nw=calc();S.products=oldP;S.moves=oldM;
 if(old.some((p,i)=>Math.abs(p.st-nw[i].st)>0.01||p.k!==nw[i].k||Math.abs(p.min-nw[i].min)>0.01))return toast('⚠ Cancelado: algún dato cambiaría');
 const n=Object.keys(adj).filter(k=>adj[k]).length;
 if(!confirm('Se eliminarán '+bad.length+' registros sin fecha.\nPara que NINGÚN stock ni estado cambie, se ajustará la base de '+n+' producto(s).\nAntes se descargará un respaldo.\n¿Continuar?'))return;
 backup();await new Promise(r=>setTimeout(r,900));
 S.products=nP;S.rev=Date.now();const hadL=bad.some(m=>String(m.id)[0]==='L');LEG=LEG.filter(m=>m.d);NEW=NEW.filter(m=>m.d);
 try{if(DB){await DB.doc('meta/config').set({products:S.products,cfg:S.cfg,rev:S.rev});if(hadL)await DB.doc('meta/legacy').set({moves:LEG});for(const m of bad.filter(m=>String(m.id)[0]!=='L'))await DB.collection('moves').doc(m.id).delete()}}catch(e){toast('⚠ Falló. Restaura el respaldo descargado');return}
 merge();toast('✔ '+bad.length+' registros eliminados. El stock quedó igual')}

 lR.onSnapshot(s=>{LEG=s.exists?(s.data().moves||[]):[];merge()},()=>sync(0));
