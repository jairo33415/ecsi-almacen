 <div class="grid2"><div class="card"><h2>🚨 Top 10 más críticos</h2>${crit.map(p=>`<div class="row"><div class="grow"><div class="nm">${esc(p.n)}</div><div class="sub">${fmt(p.st)} ${p.u} · mín ${fmt(p.min)}</div></div><div style="width:70px">${lvbar(p)}</div>${tag(p.k)}</div>`).join('')}</div>
 <div class="card"><h2>🗂 Alertas por categoría</h2>${CATS.map(([c,e])=>{const L=P.filter(p=>p.c===c),a=L.filter(p=>p.k==='BA'||p.k==='AG').length;return `<div class="row"><div class="grow nm">${e} ${c}</div><div class="sub">${a}/${L.length}</div><span class="tag ${a?'BA':'OK'}">${L.length?Math.round(a/L.length*100):0}%</span></div>`}).join('')}
 <h2 style="margin-top:14px">🔎 Calidad de datos</h2><div class="sub">Sin fecha: <b>${q[0]}</b> · Producto fuera de lista: <b>${q[1]}</b> · Cantidad inválida: <b>${q[2]}</b> · Movimientos: <b>${w.filter(m=>m.t!=='DETALLE').length}</b></div></div></div>`}
function vStock(){const P=calc().filter(p=>!sq||p.n.toLowerCase().includes(sq.toLowerCase()));
 return `<input placeholder="🔍 Buscar producto…" value="${esc(sq)}" oninput="sq=this.value;rs(1)" id="sq">`+CATS.map(([c,e])=>{const L=P.filter(p=>p.c===c);if(!L.length)return'';const a=L.filter(p=>p.k==='BA'||p.k==='AG').length;
 return `<div class="cat"><span>${e} ${c}</span><span class="${a?'w':'sub'}">${a?'⚠ '+a+' alerta(s)':'✔ Sin alertas'}</span></div><div class="card" style="padding:4px 12px">${L.map(p=>`<div class="row" onclick="quick('${esc(p.n).replace(/'/g,'&#39;')}')"><div class="grow"><div class="nm">${esc(p.n)}</div><div class="sub">mín ${p.min>0?fmt(p.min):'—'} ${p.u}</div>${lvbar(p)}</div><div style="text-align:right"><div class="big">${fmt(p.st)}</div><div class="sub">${p.u}</div></div><div style="width:106px;text-align:right">${tag(p.k)}</div></div>`).join('')}</div>`}).join('')}
function vReg(){const P=S.products,sel=P.find(p=>p.n===FM.p),cur=sel?calc().find(p=>p.n===sel.n):null,q=Number(FM.q)||0;
 const after=cur&&q>0?(FM.t==='ENTRADA'?cur.st+q:FM.t==='SALIDA'?cur.st-q:cur.st):null;
 return `<div class="card"><h2>➕ Nuevo movimiento</h2><label>TIPO</label><div class="seg">${['ENTRADA','SALIDA','DETALLE'].map(t=>`<button data-t="${t}" class="${FM.t===t?'on':''}" onclick="FM.t='${t}';rs()">${t==='ENTRADA'?'⬆':t==='SALIDA'?'⬇':'📝'} ${t}</button>`).join('')}</div>
 <label>📅 FECHA</label><input type="date" value="${FM.d||today()}" onchange="FM.d=this.value"><label>📦 PRODUCTO</label><input list="pl" placeholder="Escribe o elige…" value="${esc(FM.p)}" onchange="FM.p=this.value;rs()"><datalist id="pl">${P.map(p=>`<option value="${esc(p.n)}">`).join('')}</datalist>
 <div class="two"><div><label>🔢 CANTIDAD ${sel?'('+sel.u+')':''}</label><input type="number" inputmode="decimal" step="any" value="${esc(FM.q)}" oninput="FM.q=this.value" onchange="rs()"></div><div><label>📝 OBSERVACIÓN</label><input value="${esc(FM.o)}" oninput="FM.o=this.value" placeholder="Saco 1, lote…"></div></div>
 ${cur?`<div class="hint">Stock hoy: <b>${fmt(cur.st)} ${cur.u}</b> ${tag(cur.k)}${after!=null?`<br>Después del movimiento: <b class="${after<0?'w':''}">${fmt(after)} ${cur.u}</b>`:''}</div>`:''}
 <div class="hint">${FM.t==='DETALLE'?'DETALLE solo deja constancia: no mueve el stock.':FM.t==='SALIDA'?'SALIDA resta del stock. Queda ⏳ pendiente hasta confirmar que se consumió en el sistema general de ECSI.':'ENTRADA suma al stock.'}</div>
 <button class="btn" onclick="addMove()">Guardar movimiento</button></div>`}
function vHist(){const f={ES:m=>m.t!=='DETALLE',EN:m=>m.t==='ENTRADA',SA:m=>m.t==='SALIDA',DE:m=>m.t==='DETALLE',PE:m=>m.t==='SALIDA'&&m.x===false}[hf];
 const L=S.moves.map((m,i)=>({...m,i})).filter(f).filter(m=>!hq||(m.p+' '+m.o).toLowerCase().includes(hq.toLowerCase())).reverse().slice(0,150);
 const un=n=>(S.products.find(p=>p.n===n)||{}).u||'—';
 return `<div class="chips">${[['ES','Entradas + Salidas'],['EN','⬆ Entradas'],['SA','⬇ Salidas'],['PE','⏳ Por consumir'],['DE','📝 Detalles']].map(([k,l])=>`<button class="chip ${hf===k?'on':''}" onclick="hf='${k}';rs()">${l}</button>`).join('')}</div><input placeholder="🔍 Buscar…" value="${esc(hq)}" oninput="hq=this.value;rs(1)" id="hq" style="margin-bottom:10px">
 <div class="card" style="padding:4px 12px">${L.map(m=>`<div class="row"><span class="tag ${m.t.slice(0,2)==='EN'?'EN':m.t==='SALIDA'?'SA':'DE'}">${m.t==='ENTRADA'?'⬆':m.t==='SALIDA'?'⬇':'📝'}</span><div class="grow"><div class="nm">${esc(m.p)}</div><div class="sub">${fd(m.d)} · ${esc(m.o)}${m.u&&String(m.u).length<30?' · 👤 '+esc(m.u):''}</div></div><div style="text-align:right"><b>${fmt(m.q)}</b> <span class="sub">${un(m.p)}</span>${m.t==='SALIDA'&&m.x===false?`<br><button class="btn s" onclick="done('${m.id}')">⏳ Marcar consumido</button>`:''}</div><button class="x" onclick="del('${m.id}')" title="Eliminar">🗑</button></div>`).join('')||'<div class="sub">Sin registros.</div>'}</div>`}
function vCons(){const C=cons(calc()),t=today();
 return `<div class="kpis"><div class="kpi"><span>Con consumo 30d</span><b>${C.filter(p=>p.c30>0).length}</b></div><div class="kpi" style="--c:var(--bad)"><span>Cobertura crítica</span><b>${C.filter(p=>p.ck==='CR').length}</b></div><div class="kpi" style="--c:var(--warn)"><span>En atención</span><b>${C.filter(p=>p.ck==='AT').length}</b></div></div>
 <div class="card"><h2>📅 Rango personalizado</h2><div class="two"><div><label>DESDE</label><input type="date" value="${cr.a}" onchange="cr.a=this.value;rs()"></div><div><label>HASTA</label><input type="date" value="${cr.b}" onchange="cr.b=this.value;rs()"></div></div></div>
 ${CATS.map(([c,e])=>{const L=C.filter(p=>p.c===c);return L.length?`<div class="cat"><span>${e} ${c}</span></div><div class="card" style="padding:4px 12px">${L.map(p=>`<div class="row"><div class="grow"><div class="nm">${esc(p.n)}</div><div class="sub">7d: ${fmt(p.c7)} · 30d: ${fmt(p.c30)}${cr.a&&cr.b?' · 🎯 '+fmt(p.cu):''} · prom/día ${fmt(p.av)}</div></div><div style="text-align:right"><div class="big">${p.d==null?'—':p.d}</div><div class="sub">días</div></div><div style="width:112px;text-align:right"><span class="tag ${CK[p.ck][1]}">${CK[p.ck][0]}</span></div></div>`).join('')}</div>`:''}).join('')}`}
function vCfg(){const c=S.cfg;return `<div class="card"><h2>⚙ Reglas de alerta</h2><div class="two"><div><label>Margen ATENCIÓN sobre mínimo (%)</label><input type="number" value="${c.margin*100}" onchange="S.cfg.margin=this.value/100;sv()"></div><div><label>Mínimo por defecto (% del stock base)</label><input type="number" value="${c.defpct*100}" onchange="S.cfg.defpct=this.value/100;sv()"></div><div><label>Cobertura crítica (días)</label><input type="number" value="${c.crit}" onchange="S.cfg.crit=+this.value;sv()"></div><div><label>Cobertura en atención (días)</label><input type="number" value="${c.warn}" onchange="S.cfg.warn=+this.value;sv()"></div></div></div>
 <div class="card"><h2>🛑 Stock mínimo y base por producto</h2>${S.products.map((p,i)=>`<div class="row"><div class="grow nm">${esc(p.n)}<div class="sub">${p.c}</div></div><div style="width:92px"><label style="margin:0">BASE</label><input type="number" step="any" value="${p.b}" onchange="S.products[${i}].b=+this.value;sv()"></div><div style="width:92px"><label style="margin:0">MÍNIMO</label><input type="number" step="any" value="${p.m??''}" placeholder="auto" onchange="S.products[${i}].m=this.value===''?null:+this.value;sv()"></div></div>`).join('')}</div>
 <div class="card"><h2>➕ Producto nuevo</h2><label>NOMBRE</label><input id="np"><div class="two"><div><label>UNIDAD</label><input id="nu" value="UND"></div><div><label>CATEGORÍA</label><select id="nc">${CATS.map(([c])=>`<option>${c}</option>`).join('')}</select></div><div><label>STOCK BASE</label><input id="nb" type="number" value="0"></div><div><label>MÍNIMO</label><input id="nm" type="number"></div></div><button class="btn" onclick="addP()">Agregar producto</button></div>
 <div class="card"><h2>🧰 Datos</h2><button class="btn g" onclick="csv()">⬇ Exportar movimientos (CSV)</button><button class="btn" onclick="backup()">💾 Respaldo completo (guardar archivo)</button><button class="btn g" onclick="document.getElementById('rf').click()">♻ Restaurar respaldo</button><input type="file" id="rf" accept=".json,application/json" style="display:none" onchange="restore(this)"><div class="sub" style="margin-top:8px">El respaldo guarda todo: productos, mínimos, bases, ajustes y movimientos.</div><button class="btn g" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">🌓 Cambiar claro / oscuro</button></div>`}
/* ===== acciones ===== */
function rs(keep){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;$('#app').innerHTML={panel:vPanel,stock:vStock,reg:vReg,hist:vHist,cons:vCons,cfg:vCfg}[tab]();
 $('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';rs();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join('');
 if(keep&&id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}}
let DB=null,LEG=[],NEW=[],UN={},UID=null;
function cache(){try{localStorage.setItem('ecsi2',JSON.stringify(S))}catch(_){}}
function merge(){S.moves=[...LEG,...NEW];cache();rs(1)}
function sv(){S.rev=Date.now();cache();if(DB)DB.doc('meta/config').set({products:S.products,cfg:S.cfg,rev:S.rev}).then(()=>sync(1)).catch(()=>{sync(0);toast('⚠ Sin conexión: no se guardó')});rs(1)}
function pm(m){if(!DB){S.moves.push(m);cache();rs(1);return}NEW.push(m);merge();DB.collection('moves').doc(m.id).set(m).then(()=>sync(1)).catch(()=>{sync(0);NEW=NEW.filter(x=>x.id!==m.id);merge();toast('⚠ Sin conexión: el movimiento NO se guardó')})}
async function restoreAll(o){o.moves.forEach((m,i)=>{m.id='L'+String(i).padStart(4,'0');delete m.ts});S={...o,rev:Date.now()};LEG=o.moves;if(DB){try{await DB.doc('meta/config').set({products:S.products,cfg:S.cfg,rev:S.rev});await DB.doc('meta/legacy').set({moves:LEG});for(const m of NEW)await DB.collection('moves').doc(m.id).delete()}catch(_){toast('⚠ Falló la restauración en la nube');return}}NEW=[];merge();toast('✔ Respaldo restaurado')}
function sync(ok){$('#sync').textContent=ok?'☁ Sincronizado':'📴 Solo este equipo'}
function addMove(){const p=S.products.find(x=>x.n===FM.p),q=Number(FM.q);
 if(!p)return toast('⚠ Elige un producto de la lista');if(!(q>0))return toast('⚠ Cantidad inválida');
 const cur=calc().find(x=>x.n===p.n);if(FM.t==='SALIDA'&&q>cur.st&&!confirm('La salida supera el stock actual ('+fmt(cur.st)+'). ¿Registrar igual?'))return;
 const m={d:FM.d||today(),p:p.n,t:FM.t,q,o:FM.o.trim()};if(m.t==='SALIDA')m.x=false;m.id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);m.ts=Date.now();m.u=UID;pm(m);FM={...FM,q:'',o:''};rs(1);toast('✔ '+m.t+' registrada')}
function del(id){if(!confirm('¿Eliminar este registro? El stock se recalcula.'))return;if(!DB){S.moves=S.moves.filter(m=>m.id!==id);cache();rs(1);return}
 if(id[0]==='L'){LEG=LEG.filter(m=>m.id!==id);merge();DB.doc('meta/legacy').set({moves:LEG}).catch(()=>toast('⚠ No se pudo eliminar'))}else{NEW=NEW.filter(m=>m.id!==id);merge();DB.collection('moves').doc(id).delete().catch(()=>toast('⚠ No se pudo eliminar'))}}
function done(id){const m=S.moves.find(x=>x.id===id);if(!m)return;m.x=true;if(DB)DB.collection('moves').doc(id).update({x:true}).catch(()=>toast('⚠ Sin conexión'));else cache();rs(1);toast('✔ Marcado como consumido')}
function quick(n){FM.p=n;tab='reg';rs();scrollTo(0,0)}
function addP(){const n=$('#np').value.trim().toUpperCase();if(!n||S.products.some(p=>p.n===n))return toast('⚠ Nombre vacío o repetido');S.products.push({n,u:$('#nu').value.trim().toUpperCase()||'UND',c:$('#nc').value,b:+$('#nb').value||0,m:$('#nm').value===''?null:+$('#nm').value});sv();toast('✔ Producto agregado')}
async function csv(){const r=[['fecha','producto','tipo','cantidad','observacion','consumido_sistema'],...S.moves.map(m=>[m.d,m.p,m.t,m.q,m.o,m.t==='SALIDA'?(m.x===false?'NO':'SI'):''])].map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 try{dl('movimientos_ecsi.csv','\ufeff'+r,'text/csv;charset=utf-8')}catch(_){toast('No se pudo descargar')}}
async function backup(){try{dl('respaldo_ecsi_'+today()+'.json',JSON.stringify(S),'application/json');toast('✔ Respaldo listo')}catch(_){toast('No se pudo descargar')}}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.products)||!Array.isArray(o.moves)||!o.cfg)throw 0;if(!confirm('Esto reemplaza TODOS los datos actuales por el respaldo ('+o.products.length+' productos, '+o.moves.length+' movimientos). ¿Continuar?'))return;restoreAll(o)}catch(_){toast('⚠ Archivo de respaldo no válido')}inp.value=''};r.readAsText(f)}
/* ===== arranque + sincronización ===== */
try{S=JSON.parse(localStorage.getItem('ecsi2')||localStorage.getItem('ecsi'))}catch(_){}if(!S||!S.products)S=JSON.parse(JSON.stringify(SEED));S.moves.forEach((m,i)=>{if(!m.id)m.id='L'+String(i).padStart(4,'0')});LEG=S.moves.filter(m=>m.id[0]==='L');NEW=S.moves.filter(m=>m.id[0]!=='L');rs();
async function names(){}
async function boot(){let db=null,us=null;try{try{UID=localStorage.getItem('ecsi_user')||''}catch(_){}if(!UID){UID=(prompt('¿Cuál es tu nombre? (queda registrado en cada movimiento)')||'').trim().slice(0,24)||'Usuario';try{localStorage.setItem('ecsi_user',UID)}catch(_){}}
 if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);db=firebase.firestore()}catch(_){}if(!db){sync(0);return}
 const cR=db.doc('meta/config'),lR=db.doc('meta/legacy');
 try{const c=await cR.get();if(!c.exists){let src=S;try{const o=await db.doc('ecsi/state').get();if(o.exists)src=o.data()}catch(_){}const mv=(src.moves||[]).map((m,i)=>({...m,id:'L'+String(i).padStart(4,'0')}));await cR.set({products:src.products,cfg:src.cfg,rev:Date.now()});await lR.set({moves:mv})}}catch(_){sync(0);return}
 DB=db;
 cR.onSnapshot(s=>{if(!s.exists)return;const r=s.data();S.products=r.products;S.cfg=r.cfg;S.rev=r.rev;sync(1);cache();rs(1)},()=>sync(0));
 lR.onSnapshot(s=>{LEG=s.exists?(s.data().moves||[]):[];merge()},()=>sync(0));
 db.collection('moves').onSnapshot(q=>{NEW=q.docs.map(d=>d.data()).sort((a,b)=>(a.ts||0)-(b.ts||0));merge();names(us)},()=>sync(0))}
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
